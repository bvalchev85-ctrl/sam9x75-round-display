<meta charset="utf-8">
<title>RDK Round Menu 720</title>
<style>
  html,body{margin:0;padding:0;background:#000;}
  .screen{
    position:relative;width:720px;height:720px;overflow:hidden;
    background:
      radial-gradient(circle at 50% 42%, #123033 0%, #0b1a1e 42%, #05090b 72%, #000 100%);
    font-family:"DejaVu Sans","Liberation Sans",Arial,sans-serif;
    color:#e9f1f2;
  }
  /* faint warm sweep, like the mockup */
  .sweep{
    position:absolute;inset:0;
    background:conic-gradient(from 210deg at 50% 50%,
      rgba(214,160,72,0) 0deg, rgba(214,160,72,.22) 26deg, rgba(214,160,72,0) 70deg);
    filter:blur(2px);
  }
  .ring{
    position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
    border-radius:50%;border:1px dashed rgba(150,200,205,.16);
  }
  .r1{width:640px;height:640px}
  .r2{width:500px;height:500px}
  .r3{width:360px;height:360px;border-style:solid;border-color:rgba(196,150,60,.45)}
  .status{
    position:absolute;left:0;right:0;top:76px;text-align:center;
    font-family:"DejaVu Sans Mono","Liberation Mono",monospace;
    font-size:19px;letter-spacing:.14em;color:#93a5a8;
  }
  .bars{display:inline-block;vertical-align:-2px;margin-right:10px}
  .bars i{display:inline-block;width:3px;margin-right:2px;background:#34c9b8;vertical-align:bottom}
  .bars i:nth-child(1){height:5px}.bars i:nth-child(2){height:8px}
  .bars i:nth-child(3){height:11px}.bars i:nth-child(4){height:14px}
  .center{
    position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
    width:250px;height:250px;border-radius:34px;
    display:flex;align-items:center;justify-content:center;
    background:radial-gradient(circle at 50% 45%, rgba(58,196,220,.16), rgba(0,0,0,0) 68%);
  }
  .side{position:absolute;top:50%;transform:translateY(-50%);opacity:.62}
  .left{left:118px}.right{right:118px}
  .label{
    position:absolute;left:0;right:0;bottom:150px;text-align:center;
    font-size:30px;font-weight:600;letter-spacing:.02em;color:#eaf3f4;
  }
  .dots{position:absolute;left:0;right:0;bottom:112px;text-align:center}
  .dots b{display:inline-block;width:8px;height:8px;border-radius:50%;
    background:#3a4a4e;margin:0 6px}
  .dots b.on{background:#34c9b8;width:22px;border-radius:4px}
</style>
<div class="screen">
  <div class="sweep"></div>
  <div class="ring r1"></div><div class="ring r2"></div><div class="ring r3"></div>

  <div class="status"><span class="bars"><i></i><i></i><i></i><i></i></span>eth0 &nbsp;·&nbsp; 09:41</div>

  <!-- left: thermostat -->
  <div class="side left">
    <svg width="86" height="86" viewBox="0 0 24 24" fill="none" stroke="#9b7fe0" stroke-width="1.5"
         stroke-linecap="round" stroke-linejoin="round">
      <path d="M14 14.76V3.5a2 2 0 1 0-4 0v11.26a4 4 0 1 0 4 0z"/>
    </svg>
  </div>

  <!-- centre: camera -->
  <div class="center">
    <svg width="188" height="188" viewBox="0 0 24 24" fill="none" stroke="#4bd3e8" stroke-width="1.4"
         stroke-linecap="round" stroke-linejoin="round">
      <rect x="2.2" y="6.4" width="19.6" height="13.2" rx="3.2"/>
      <path d="M8.4 6.4l1.5-2.4h4.2l1.5 2.4"/>
      <path d="M15.2 13a3.2 3.2 0 1 1-3.2-3.2" />
      <circle cx="17.6" cy="10" r="0.9" fill="#4bd3e8" stroke="none"/>
    </svg>
  </div>

  <!-- right: settings -->
  <div class="side right">
    <svg width="86" height="86" viewBox="0 0 24 24" fill="none" stroke="#8f7fd8" stroke-width="1.5"
         stroke-linecap="round" stroke-linejoin="round">
      <circle cx="10" cy="10" r="3"/>
      <path d="M10 1.6v2.2M10 16.2v2.2M2.6 10H.4M19.6 10h-2.2M4.8 4.8L3.2 3.2M16.8 16.8l-1.6-1.6M4.8 15.2l-1.6 1.6M16.8 3.2l-1.6 1.6"/>
      <circle cx="18.5" cy="18.5" r="2.2"/>
    </svg>
  </div>

  <div class="label">Camera</div>
  <div class="dots"><b></b><b class="on"></b><b></b></div>
</div>
